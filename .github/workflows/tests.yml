name: Playwright UI Tests
on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the job checks out code and runs tests, nothing more.
permissions:
  contents: read

# Supersede an in-flight run when the same ref is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # Single source of truth: read the version from .nvmrc so the
          # workflow and local setup cannot drift apart.
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci

      # Static checks run BEFORE the browser download. They take seconds and
      # need no browsers, so a type error or lint failure fails the job
      # without first pulling several hundred megabytes of Chromium, Firefox
      # and WebKit.
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check

      # Configuration unit tests: no browser, no network, ~0.3s. Run here so a
      # logic regression fails before the browser download.
      #
      # `npm run test:unit` is invoked directly rather than via `npm run
      # verify`, which also includes it — calling verify here would execute the
      # same suite twice in one job.
      - name: Unit tests (configuration)
        run: npm run test:unit

      - name: Install browsers
        run: npx playwright install --with-deps
      - name: Run tests
        run: npm test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
